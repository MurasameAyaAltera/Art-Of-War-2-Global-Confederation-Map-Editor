plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aowmaps'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aowmaps.editor'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
